dbt_airbnb:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: silver_layer
      keyfile: "/opt/airflow/credentials/gcp_service_account.json"
      threads: 4
      timeout_seconds: 300
      location: US