x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  dns:
    - 8.8.8.8
    - 8.8.4.4
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFfDewQ9e65RqAsnk=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__LOGGING_LEVEL=INFO
    - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/credentials/gcp_service_account.json
    - GCP_PROJECT_ID=moonlit-poetry-510206-t4   # <<< Thay đúng Project ID thực tế của bạn
    - DBT_PROFILES_DIR=/opt/airflow/dbt_project
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt_project:/opt/airflow/dbt_project
    - ./credentials:/opt/airflow/credentials
    - ./data:/opt/airflow/data
    - ./models_saved:/opt/airflow/models_saved
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      - airflow-init

  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp_service_account.json
      - GCP_PROJECT_ID=moonlit-poetry-510206-t4   # <<< Thay đúng Project ID thực tế của bạn
    volumes:
      - ./streamlit_app:/app
      - ./credentials:/app/credentials
      - ./models_saved:/app/models_saved
    restart: always

volumes:
  postgres-db-volume: